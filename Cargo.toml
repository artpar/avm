[package]
name = "avm"
version = "0.3.1"
edition = "2024"
license = "Apache-2.0"
description = "Host-owned visual computer instrumentation for coding agents"
repository = "https://github.com/artpar/avm"
homepage = "https://github.com/artpar/avm"
documentation = "https://docs.rs/avm"
readme = "README.md"
keywords = ["agents", "virtual-machine", "observability", "qemu", "automation"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
axum = "0.8.9"
base64 = "0.22"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zbus = { version = "5.11", features = ["p2p"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "debuginfo"
