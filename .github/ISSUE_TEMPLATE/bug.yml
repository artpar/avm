name: Bug report
description: Report reproducible incorrect behavior in AVM.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private evidence, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: AVM version
      description: Paste `avm --version` or the Git commit.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Linux/KVM host
        - Local supervisor
        - GCE remote channel
        - CI or release artifact
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the expected behavior and the actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence that reproduces the issue.
      placeholder: |
        1. Run ...
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Drag files here or paste logs after removing sensitive data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private run/evidence data.
          required: true
        - label: This is not a security vulnerability.
          required: true
