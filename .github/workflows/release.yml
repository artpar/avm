name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package for an initial release
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Open or update the semantic release pull request
        if: github.ref_type != 'tag' && inputs.release_tag == ''
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4

      - name: Create the initial draft release
        if: github.ref_type == 'tag' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --generate-notes

      - name: Check out the release commit
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.sha || inputs.release_tag || steps.release.outputs.sha }}

      - name: Install Node.js
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supervisor/browser/package-lock.json

      - name: Install pinned Rust toolchain
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        run: rustup toolchain install 1.87.0 --profile minimal --component clippy,rustfmt

      - name: Test the release commit
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        run: make ci

      - name: Build release archive and checksum
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        run: make package

      - name: Attest release archive provenance
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: dist/*.tar.gz

      - name: Attach artifacts to the draft release
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || steps.release.outputs.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber

      - name: Publish the verified release
        if: github.ref_type == 'tag' || inputs.release_tag != '' || steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag || steps.release.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
